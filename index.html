<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MGL CHESS</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#101318;color:#fff;font-family:Arial,sans-serif}
header{padding:22px 18px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #303640}
.logo{font-size:25px;font-weight:bold;color:#e9b65c}
button{background:#202733;color:white;border:1px solid #424c5b;padding:13px 18px;border-radius:9px;font-size:15px;cursor:pointer}
button:hover{background:#354254}
main{max-width:650px;margin:65px auto;padding:20px;text-align:center}
h1{font-size:42px;margin-bottom:10px}
.gold{color:#e9b65c}
p{color:#aab2bf;line-height:1.6}
.actions{display:grid;gap:13px;margin-top:35px}
.actions button{font-size:18px;padding:18px}
.primary{background:#b88636;border:0;color:#111;font-weight:bold}
footer{text-align:center;color:#777;padding:35px}
select{background:#202733;color:white;padding:10px;border-radius:8px}
</style>
</head>
<body>
<header>
<div class="logo">♟ MGL CHESS</div>
<select id="lang" onchange="changeLang()">
<option value="en">English</option>
<option value="mn">Монгол</option>
</select>
</header>
<main>
<h1 id="title">PLAY <span class="gold">CHESS</span></h1>
<p id="desc">Challenge players from around the world.<br>Improve your skills and become a champion.</p>
<div class="actions">
<button class="primary" onclick="alert('Online matchmaking is coming soon!') " id="play">♟ Play Online</button>
<button onclick="alert('Puzzles are coming soon!')" id="puzzle">♙ Puzzles</button>
<button onclick="alert('Global ranking is coming soon!')" id="rank">🏆 Ranking</button>
<button onclick="alert('Account system is coming soon!')" id="login">Login / Register</button>
</div>
</main>
<footer>MGL CHESS © 2026 · Global Online Chess</footer>
<script>
function changeLang(){
const mn=document.getElementById('lang').value==='mn';
document.getElementById('title').innerHTML=mn?'ШAТАР <span class="gold">ТОГЛОЁ</span>':'PLAY <span class="gold">CHESS</span>';
document.getElementById('desc').innerHTML=mn?'Дэлхийн өнцөг булан бүрийн тоглогчидтой өрсөлд.<br>Ур чадвараа хөгжүүл.':'Challenge players from around the world.<br>Improve your skills and become a champion.';
document.getElementById('play').textContent=mn?'♟ Онлайн тоглох':'♟ Play Online';
document.getElementById('puzzle').textContent=mn?'♙ Бодлого':'♙ Puzzles';
document.getElementById('rank').textContent=mn?'🏆 Чансаа':'🏆 Ranking';
document.getElementById('login').textContent=mn?'Нэвтрэх / Бүртгүүлэх':'Login / Register';
}
</script>
</body>
</html>
